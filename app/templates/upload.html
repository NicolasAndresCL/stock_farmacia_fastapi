{% extends "base.html" %}

{% block title %}
Carga de archivos | Stock Farmacia
{% endblock %}

{% block content %}
<div class="card">
    <h2>Cargar archivos Excel</h2>

    <p>
        Selecciona uno o más libros Excel para procesar el stock.
    </p>

    <form action="/upload" method="post" enctype="multipart/form-data">
        <input
            type="file"
            name="files"
            accept=".xlsx,.xls"
            multiple
            required
        >
        <br><br>

        <button type="submit">
            Procesar archivos
        </button>
    </form>

    <br>
    <a href="/">← Volver al inicio</a>
</div>
{% endblock %}
